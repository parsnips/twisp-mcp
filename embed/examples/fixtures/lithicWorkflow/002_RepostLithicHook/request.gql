mutation PostLithicHook(
  $executionId: UUID!
  $accountId: UUID!
  $journalId: UUID!
  $settlementAccountId: UUID!
  $webhook: JSON!
){
  workflow {
    executeTask(
      input: {
        task: "LITHIC_WEBHOOK"
        workflowId: "cb1c78ce-2812-11ef-9cab-069b540ea27d"
        executionId: $executionId
        params: {
          accountId: $accountId
          settlementAccountId: $settlementAccountId
          journalId: $journalId
          webhook: $webhook
        }
      }
    ) {
      state
      transactions(first:1000) {
        transactionId 
        entries(first: 100) {
          nodes {
            layer
            direction
            amount {
              units
              currency
            }              
          }
        }
      }
    }
  }
}
