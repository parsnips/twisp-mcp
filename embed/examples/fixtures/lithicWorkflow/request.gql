  createAccount(
    input: {
      accountId: "7ccb98f2-d69a-467a-b066-a8943acd0f5a"
      name: "Card Account"
      code: "7ccb98f2-d69a-467a-b066-a8943acd0f5a"
    }
  ) {
    accountId
  }
}
