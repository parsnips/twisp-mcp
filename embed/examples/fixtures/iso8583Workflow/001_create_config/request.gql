########################################
# Create an iso configuration
########################################
mutation CreateISO8583Configuration(
  $configId: UUID! = "e71f1316-08e4-11f0-be3c-069b540ea27c"
  $journalId: UUID! = "000000000-0000-0000-0000-0000000000000"
  $settlementAccountId: UUID! = "f4a3cb70-9ace-4885-a3ca-d0b3a37bd847"
  $timeZone: String! = "America/Chicago"
) {
  create: iso8583 {
    createConfig(
      input: {
        configId: $configId
        journalId: $journalId
        settlementAccountId: $settlementAccountId
        timeZone: $timeZone
        processor: I2C
      }
    ) {
      configId
    }
  }
  update: iso8583 {
    updateConfig(configId: $configId, input: { timeZone: "America/Los_Angeles" }) {
      timeZone
    }
  }
}
