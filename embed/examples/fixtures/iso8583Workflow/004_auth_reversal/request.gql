########################################
# Process an authorization reversal
########################################
mutation ProcessISO8583Reversal(
  # account to post transaction to
  $accountId: UUID! = "6c6affb0-5cf5-402b-8d84-01bfc1624a2c"
  $configId: UUID! = "e71f1316-08e4-11f0-be3c-069b540ea27c"
  # Functions as a request identifier... for idempotency around handling a single message.
  $executionId: UUID! = "9271321c-08f9-11f0-9858-069b540ea27c"
  $today: Date! = "2025-01-01"
  # The moov.io JSON representation of the ISO message. W/Shared SPEC
  $isoReq: JSON! = """
  {"0":"0420","1":"F67A44910AE0A40A0000000004020000","2":"100194868736564","3":"000000","4":"20000","6":"20100","7":"0122134443","10":"61005000","11":"016380","12":"184443","13":"0122","15":"0122","18":"5541","22":"902","25":"00","28":"D00000000","32":"000000","37":"802213016380","39":"00","41":"TERMID01","42":"CARD ACCEPTOR  ","43":"ACQUIRER NAME            CITY NAME    CAUSA                           ","49":"840","51":"840","54":"0072840D000000000100","61":"0000000004020000","63":{"01":"0002","02":"    ","03":"123456123456123 ","04":"         ","05":" ","06":"0                       ","07":"VISA        "},"102":"100194868736768","111":" 123456123456123     00                          000000 0000000000 000000000000     0000000000            00020000000000000000               00    0686491"}
  """
) {
  create: workflow {
    execute(
      input: {
        task: "PROCESS_MESSAGE"
        code: "ISO_8583"
        executionId: $executionId
        params: { configId: $configId, accountId: $accountId, effective: $today, isoReq: $isoReq }
      }
    ) {
      workflowId
      output {
        state
      }
    }
  }
}
