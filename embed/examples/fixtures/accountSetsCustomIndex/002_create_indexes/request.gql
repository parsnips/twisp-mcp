mutation createAccountSetIndex {
  schema {
    partition: createIndex(
      input: {name: "priority", on: AccountSet, unique: false, partition: [{alias: "priority", value: "string(document.metadata.priority)"}], sort: [], constraints: {a: "1 + 1 == 2"}}
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
    }

    # note that the sort index has a constraint that nickname must exist
    sort: createIndex(
      input: {name: "nickname", on: AccountSet, unique: false, partition: [], sort: [{alias: "nickname", value: "string(has(document.metadata.nickname) ? document.metadata.nickname : string(''))", sort: ASC}], constraints: {nickname: "has(document.metadata.nickname)"}}
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
    }

    combined: createIndex(
      input: {name: "priority-nickname", on: AccountSet, unique: false, partition: [{alias: "priority", value: "string(document.metadata.priority)"}], sort: [{alias: "nickname", value: "string(has(document.metadata.nickname) ? document.metadata.nickname : string(''))", sort: ASC}], constraints: {a: "1 + 1 == 2"}}
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
    }
  }
}
