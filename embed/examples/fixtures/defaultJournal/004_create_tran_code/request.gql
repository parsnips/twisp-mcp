mutation {
createTranCode(
    input: {
      tranCodeId: "3fa2116e-675b-4970-97b2-c36252629695"
      code: "TRANSFER"
      description: "A transfer between two accounts"
      params: [
        {name: "toAccount", type: UUID, description: "transfer to this account"}
        {name: "fromAccount", type: UUID, description: "transfer from this account"}
        {name: "amount", type: DECIMAL, description: "Amount with decimal, e.g. `1.23`."}
        {name: "effective", type: DATE, description: "Effective date for transaction."}
      ]
      transaction: {effective: "params.effective"}
      entries: [
        {
          accountId: "params.fromAccount"
          units: "params.amount"
          currency: "'USD'",
          entryType: "'TRANSFER_DR'"
          direction: "DEBIT", layer: "SETTLED"
        }
        {
          accountId: "params.toAccount"
          units: "params.amount"
          currency: "'USD'"
          entryType: "'TRANSFER_CR'"
          direction: "CREDIT"
          layer: "SETTLED"
        }
      ]
    }
  ) {
    tranCodeId
  }
}
