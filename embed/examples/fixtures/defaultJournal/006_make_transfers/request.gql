mutation MakeTransfers($ernieId: UUID!, $bertId: UUID!) {
  A: postTransaction(
    input: {transactionId: "48a428bd-c1ba-47e6-abc2-ae024adfe5d3", tranCode: "TRANSFER", params: {toAccount: $ernieId, fromAccount: $bertId, amount: "100.00", effective: "2023-01-01"}}
  ) {
    transactionId
  }
  B: postTransaction(
    input: {transactionId: "5d24491d-80d4-40bf-abff-f03687fd6b4b", tranCode: "TRANSFER", params: {toAccount: $ernieId, fromAccount: $bertId, amount: "100.00", effective: "2023-01-05"}}
  ) {
    transactionId
  }
  C: postTransaction(
    input: {transactionId: "33529c21-5a3b-4913-a4bd-fca8f7eef12d", tranCode: "TRANSFER", params: {toAccount: $bertId, fromAccount: $ernieId, amount: "100.00", effective: "2023-01-10"}}
  ) {
    transactionId
  }
}
