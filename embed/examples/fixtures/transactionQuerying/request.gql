query GetTransactions {
  transactions(
    params: {
      index: {
        name: JOURNAL_AND_EFFECTIVE_DATE
        sort: DESC
      }
      where: {
        journalId: { eq: "822cb59f-ce51-4837-8391-2af3b7a5fc51" }
        effective: { gte: "{{date.Today()}}" }
      }
    }
    first: 10
  ) {
    nodes {
      transactionId
      effective
      created
      tranCode {
        tranCodeId
        code
      }
      entries {
        account {
          name
        }
        units
        entryType
        direction
      }
    }
    pageInfo {
      hasNextPage
      endCursor
    }
  }
}
