query {
  deposits: transactions(
    params: {
      index: { name: JOURNAL_AND_TRAN_CODE }
      where: {
        journalId: { eq: "822cb59f-ce51-4837-8391-2af3b7a5fc51" }
        tranCodeId: { eq: "45f3f5da-034e-40c1-aaff-ab6d01bd446f" }
      }
    }
    first: 10
  ) {
    nodes {
      transactionId
      journalId
      tranCode {
        code
      }
    }
  }
}
