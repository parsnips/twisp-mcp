query {
  sep_8_activity: transactions(
    params: {
      index: { name: JOURNAL_AND_EFFECTIVE_DATE }
      where: {
        journalId: { eq: "822cb59f-ce51-4837-8391-2af3b7a5fc51" }
        effective: { eq: "2022-09-08" }
      }
    }
    first: 10
  ) {
    nodes {
      transactionId
      journalId
      effective
    }
  }
}
