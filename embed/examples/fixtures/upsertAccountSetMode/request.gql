mutation UpsertAccountSet {
  # First create a journal to use for account sets
  journal: createJournal(
    input: {
      journalId: "1e7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      name: "Test Journal"
      description: "Journal for testing account set upsert"
    }
  ) {
    journalId
  }

  # Create account set with upsert flag
  a:createAccountSet(
    input: {
      accountSetId: "2f7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      journalId: "1e7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      name: "TestAccountSet"
      description: "Testing account set upsert"
      normalBalanceType: CREDIT
      config: {
        upsert: true
      }
    }
  ) {
    accountSetId
  }
  
  # Create again with same ID - should not error due to upsert
  b:createAccountSet(
    input: {
      accountSetId: "2f7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      journalId: "1e7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      name: "TestAccountSet"
      description: "Testing account set upsert"
      normalBalanceType: CREDIT
      config: {
        upsert: true
      }
    }
  ) {
    accountSetId
  } 
}