mutation CreateCustomerAccounts($ernieId: UUID!, $bertId: UUID!) {
  ernie_checking: createAccount(
    input: {accountId: $ernieId, name: "Ernie Bishop - Checking", code: "ERNIE.CHECKING.accounts_test", description: "Ernie's checking account", normalBalanceType: CREDIT}
  ) {
    accountId
    name
  }
  bert_checking: createAccount(
    input: {accountId: $bertId, name: "Bert - Checking", code: "BERT.CHECKING.accounts_test", description: "Bert's checking account", normalBalanceType: CREDIT}
  ) {
    accountId
    name
  }
}
