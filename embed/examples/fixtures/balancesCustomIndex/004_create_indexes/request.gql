mutation createBalanceIndexes {
  schema {
    account: createIndex(
      input: {
        name: "account",
        on: Balance,
        unique: false,
        partition: [{alias: "account_id", value: "document.account_id"}],
        sort: []
        constraints: {
          isStandardBalance: "document.calculation_id == uuid('00000000-0000-0000-0000-000000000000')"
        }
      }
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
      historical
    }

    account_journal: createIndex(
      input: {
        name: "account_journal",
        on: Balance,
        unique: false,
        partition: [
          {alias: "account_id", value: "document.account_id"},
          {alias: "journal_id", value: "document.journal_id"},
        ],
        sort: []
        constraints: {
          isStandardBalance: "document.calculation_id == uuid('00000000-0000-0000-0000-000000000000')"
        }
      }
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
      historical
    }

    dr_balance: createIndex(
      input: {
        name: "dr_balance",
        on: Balance,
        unique: false,
        partition: [{alias: "journal_id", value: "document.journal_id"}],
        sort: [{alias: "dr_balance", value: "document.settled.dr_balance.decimal()", sort: ASC}],
        constraints: {
          isStandardBalance: "document.calculation_id == uuid('00000000-0000-0000-0000-000000000000')"
        }
      }
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
      historical
    }

    normal_balance: createIndex(
      input: {
        name: "normal_balance",
        on: Balance,
        unique: false,
        partition: [{alias: "journal_id", value: "document.journal_id"}],
        sort: [{alias: "normal_balance", value: "(document.settled.cr_balance - document.settled.dr_balance).decimal()", sort: ASC}],
        constraints: {
          isStandardBalance: "document.calculation_id == uuid('00000000-0000-0000-0000-000000000000')"
        }
      }
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
      historical
    }

    normal_balance_historical: createHistoricalIndex(
      input: {
        name: "normal_balance_historical",
        on: Balance,
        partition: [{alias: "journal_id", value: "document.journal_id"}, {alias: "account_id", value: "document.account_id"}],
        sort: [{alias: "normal_balance", value: "decimal(document.settled.cr_balance - document.settled.dr_balance)", sort: ASC}],
        constraints: {
          isStandardBalance: "document.calculation_id == uuid('00000000-0000-0000-0000-000000000000')"
        }
      }
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
      historical
    }
  }
}
