query balances($generalJournalId: String!) {
  all_journals: balances(
    index: {name: CUSTOM, sort: ASC}
    where: {
      custom: {
        index: "dr_balance",
        partition: { alias: "journal_id", value: { eq: $generalJournalId }}
        sort: { alias: "dr_balance", value: { eq: "0" }}
      }
    }
    first: 10
  ) {
    nodes {
      journalId
      accountId
      settled {
        crBalance {
          units
          currency
        }
        drBalance {
          units
          currency
        }
        normalBalance {
          units
          currency
        }
      }
    }
  }
}

