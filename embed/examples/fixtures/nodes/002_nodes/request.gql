query nodes {
  # fmt.Printf("%s:%s\n", "ac", base64.RawStdEncoding.EncodeToString([]byte(`{"1":"97d8ba56-f5a2-4f13-997f-fb9341db5dd1"}`)))
  account: node(id: "ac:eyIxIjoiOTdkOGJhNTYtZjVhMi00ZjEzLTk5N2YtZmI5MzQxZGI1ZGQxIn0") {
    id
    ... on Account {
      accountId
      name
      description
    }
  }

  # fmt.Printf("%s:%s\n", "as", base64.RawStdEncoding.EncodeToString([]byte(`{"1":"a390b05c-5442-4db7-b114-a4e90e444253"}`)))
  accountSet: node(id: "as:eyIxIjoiYTM5MGIwNWMtNTQ0Mi00ZGI3LWIxMTQtYTRlOTBlNDQ0MjUzIn0") {
    id
    ... on AccountSet {
      accountSetId
      name
      description
    }
  }

  # fmt.Printf("%s:%s\n", "cl", base64.RawStdEncoding.EncodeToString([]byte(`{"1":"arn:aws:iam::123456789012:role/S3Access"}`)))
  client: node(id: "cl:eyIxIjoiYXJuOmF3czppYW06OjEyMzQ1Njc4OTAxMjpyb2xlL1MzQWNjZXNzIn0") {
    id
    ... on Client {
      principal
      name
      policies {
        effect
        actions
        resources
      }
    }
  }

  # fmt.Printf("%s:%s\n", "ba", base64.RawStdEncoding.EncodeToString([]byte(
  #   `{"1":"97d8ba56-f5a2-4f13-997f-fb9341db5dd1","2":"e7a7db57-12d7-4130-a2b6-ff061cbf291b","3":"USD"}`,
  # )))
  balance_usd: node(id: "ba:eyIxIjoiOTdkOGJhNTYtZjVhMi00ZjEzLTk5N2YtZmI5MzQxZGI1ZGQxIiwiMiI6ImU3YTdkYjU3LTEyZDctNDEzMC1hMmI2LWZmMDYxY2JmMjkxYiIsIjMiOiJVU0QifQ") {
    id
    ... on Balance {
      accountId
      journalId
      currency
      settled {
        drBalance {
          units
          currency
        }
      }
    }
  }

  # fmt.Printf("%s:%s\n", "ix", base64.RawStdEncoding.EncodeToString([]byte(`{"1":"normal_balance","2":"Balance"}`)))
  index: node(id: "ix:eyIxIjoibm9ybWFsX2JhbGFuY2UiLCIyIjoiQmFsYW5jZSJ9") {
    id
    ... on Index {
      name
      on
      partition { alias }
      range { alias }
    }
  }

  # fmt.Printf("%s:%s\n", "jl", base64.RawStdEncoding.EncodeToString([]byte(`{"1":"e7a7db57-12d7-4130-a2b6-ff061cbf291b"}`)))
  journal: node(id: "jl:eyIxIjoiZTdhN2RiNTctMTJkNy00MTMwLWEyYjYtZmYwNjFjYmYyOTFiIn0") {
    id
    ... on Journal {
      journalId
      name
      description
    }
  }

  # fmt.Printf("%s:%s\n", "tc", base64.RawStdEncoding.EncodeToString([]byte(`{"1":"3fa2116e-675b-4970-97b2-c36252629695"}`)))
  tranCode: node(id: "tc:eyIxIjoiM2ZhMjExNmUtNjc1Yi00OTcwLTk3YjItYzM2MjUyNjI5Njk1In0") {
    id
    ... on TranCode {
      tranCodeId
      status
      description
      code
    }
  }

  # fmt.Printf("%s:%s\n", "tx", base64.RawStdEncoding.EncodeToString([]byte(`{"1":"5d24491d-80d4-40bf-abff-f03687fd6b4b"}`)))
  transaction: node(id: "tx:eyIxIjoiNWQyNDQ5MWQtODBkNC00MGJmLWFiZmYtZjAzNjg3ZmQ2YjRiIn0") {
    id
    ... on Transaction {
      transactionId
      effective
    }
  }
}
