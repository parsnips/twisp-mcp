mutation Velocity{
  r1:createVelocityLimit(
    input: {
      velocityLimitId: "1be4132a-a389-45c3-9a61-0fe601d1ba8b"
      name: "Test Velocity Limit"
      description: "Test Velocity Limit per effective day"
      window: [
        {alias:"year", value:"context.vars.transaction.effective.getYear()" }
        {alias:"month", value:"context.vars.transaction.effective.getMonth()"}
        {alias:"day", value:"context.vars.transaction.effective.getDay()"}
      ]
      currency: "USD"
      limit: {
        balance: [{
          layer: "{'SETTLED':SETTLED, 'PENDING':PENDING, 'ENCUMBRANCE':ENCUMBRANCE}[params.layer]"
          amount: "params.amount"
          normalBalanceType: "{'DEBIT': DEBIT, 'CREDIT': CREDIT}[params.normalBalanceType]"
        }]
      }
      params: [
        { name: "layer", type: STRING, description: "layer", default: "SETTLED" }
        { name: "amount", type: DECIMAL, description: "amount", default: "100.00" }
        { name: "normalBalanceType", type: STRING, description: "normal balance", default: "DEBIT" }
      ]
    }
  ) {
    velocityLimitId
    name
    description
    window {
      alias
      value
    }
    condition
    currency
    limit {
      balance {
        layer
        amount
      }
    }
  }

  r2:createVelocityLimit(
    input: {
      velocityLimitId: "370ac19b-a48c-4480-9b1f-18c39d214a0a"
      name: "Test Velocity Limit Monthly"
      description: "Test Velocity Limit per effective month"
      window: [
        {alias:"year", value:"context.vars.transaction.effective.getYear()" }
        {alias:"month", value:"context.vars.transaction.effective.getMonth()"}
      ]
      currency: "USD"
      limit: {
        balance: [{
          layer: "{'SETTLED':SETTLED, 'PENDING':PENDING, 'ENCUMBRANCE':ENCUMBRANCE}[params.layer]"
          amount: "params.amount"
          normalBalanceType: "{'DEBIT': DEBIT, 'CREDIT': CREDIT}[params.normalBalanceType]"
        }]
      }
      params: [
        { name: "layer", type: STRING, description: "layer", default: "SETTLED" }
        { name: "amount", type: DECIMAL, description: "amount", default: "300.00" }
        { name: "normalBalanceType", type: STRING, description: "normal balance", default: "DEBIT" }
      ]
    }
  ) {
    velocityLimitId
    name
    description
    window {
      alias
      value
    }
    condition
    currency
    limit {
      balance {
        layer
        amount
      }
    }
  }

  rejectControl:createVelocityControl(
    input: {
      velocityControlId: "f6f27892-dfd8-480b-9213-d6adf7ef04ef"
      name: "Engineering"
      description: "Velocity Controls for Engineering"
      condition: "context.vars.transaction.?metadata.disableVelocityControl.orValue(false) == false"
      enforcement: {
        action: REJECT
      }
    }
  ) {
    velocityControlId
    name
    description
  }

  warnControl:createVelocityControl(
    input: {
      velocityControlId: "b57b238f-6fd8-42d0-8a99-f88fadf377aa"
      name: "Engineering"
      description: "Velocity Controls for Engineering"
      enforcement: {
        action: WARN
      }
    }
  ) {
    velocityControlId
    name
    description
  }

  createJournal(
    input: {
      journalId: "00000000-0000-0000-0000-000000000000"
      code: "GL"
      name:"GL"
    }
  ) {
    journalId
  }

  a1:createAccount(
    input:{
      accountId: "480ff40e-016c-4677-80ee-2b62bd34182d"
      code: "480ff40e-016c-4677-80ee-2b62bd34182d"
      name: "480ff40e-016c-4677-80ee-2b62bd34182d"
    }
  ) {
    accountId
  }

  add1: addLimitToControl(
    velocityControlId: "f6f27892-dfd8-480b-9213-d6adf7ef04ef"
    velocityLimitId: "1be4132a-a389-45c3-9a61-0fe601d1ba8b"
  ) {
    velocityControlId
  }

  c1:attachVelocityControl(
    accountId: "480ff40e-016c-4677-80ee-2b62bd34182d"
    velocityControlId: "f6f27892-dfd8-480b-9213-d6adf7ef04ef"
    params: {
      layer: "ENCUMBRANCE"
      amount: "100.00"
      normalBalanceType: "DEBIT"
    }
  ) {
    velocityControlId
  }

  add2: addLimitToControl(
    velocityControlId: "b57b238f-6fd8-42d0-8a99-f88fadf377aa"
    velocityLimitId: "370ac19b-a48c-4480-9b1f-18c39d214a0a"
  ) {
    velocityControlId
  }

  c2:attachVelocityControl(
    accountId: "480ff40e-016c-4677-80ee-2b62bd34182d"
    velocityControlId: "b57b238f-6fd8-42d0-8a99-f88fadf377aa"
    params: {
      layer: "ENCUMBRANCE"
      amount: "300.00"
      normalBalanceType: "DEBIT"
    }
  ) {
    velocityControlId
  }

  a2:createAccount(
    input:{
      accountId: "a767e377-0f35-401f-8f21-84c121b6dc00"
      code: "a767e377-0f35-401f-8f21-84c121b6dc00"
      name: "a767e377-0f35-401f-8f21-84c121b6dc00"
    }
  ) {
    accountId
  }

  a3:createAccount(
    input:{
      accountId: "a937931b-627e-4890-aaa5-e3e98331249e"
      code: "a937931b-627e-4890-aaa5-e3e98331249e"
      name: "a937931b-627e-4890-aaa5-e3e98331249e"
      config: {
        enableConcurrentPosting: true
      }
    }
  ) {
    accountId
  }

  c3:attachVelocityControl(
    accountId: "a937931b-627e-4890-aaa5-e3e98331249e"
    velocityControlId: "f6f27892-dfd8-480b-9213-d6adf7ef04ef"
    params: {
      layer: "ENCUMBRANCE"
      amount: "100.00"
      normalBalanceType: "DEBIT"
    }
  ) {
    velocityControlId
  }

  c4:attachVelocityControl(
    accountId: "a937931b-627e-4890-aaa5-e3e98331249e"
    velocityControlId: "b57b238f-6fd8-42d0-8a99-f88fadf377aa"
    params: {
      layer: "ENCUMBRANCE"
      amount: "300.00"
      normalBalanceType: "DEBIT"
    }
  ) {
    velocityControlId
  }

  createTranCode(
    input: {
      tranCodeId: "9eb60ed8-438e-4d99-9bd6-ba94f2b91e91"
      code:"BOOK_TRANSFER"
      description: "Book transfer between two internal accounts."
      metadata: { category: "Internal" }
      params: [
        { name: "crAccount", type: UUID, description: "Account to credit." }
        { name: "drAccount", type: UUID, description: "Account to debit." }
        { name: "amount", type: DECIMAL, description: "Amount with decimal, e.g. `1.23`." }
        { name: "currency", type: STRING, description: "Currency used for transaction." }
        { name: "effective", type: DATE, description: "Effective date for transaction." }
        { name: "journalId", type: UUID, description: "Journal" default:"00000000-0000-0000-0000-000000000000" }
        { name: "correlationId", type: STRING, description: "Correlation Id" }
        { name: "metadata", type: JSON, description: "Metadata", default: "{}" }
        { name: "layer", type: INTEGER, description: "layer to post", default: "1" }
      ]
      transaction: {
        journalId: "params.journalId"
        effective: "params.effective"
        description: "'Book transfer for $' + string(params.amount)"
        correlationId: "params.correlationId"
        metadata: "params.metadata"
      }
      entries: [
        {
          accountId: "params.drAccount"
          units: "params.amount"
          currency: "params.currency"
          entryType: "'BOOK_TRANSFER_DR'"
          direction: "DEBIT"
          layer: "params.layer"
        }
        {
          accountId: "params.crAccount"
          units: "params.amount"
          currency: "params.currency"
          entryType: "'BOOK_TRANSFER_CR'"
          direction: "CREDIT"
          layer: "params.layer"
        }
      ]
    }
  ) {
    tranCodeId
  }
  blockCreditsLimit: createVelocityLimit(
    input:{
      velocityLimitId: "856502e0-3984-47c3-b15a-07a6f62c15c2"
      name: "Credit Block Velocity Limit"
      description: "limits credits from posting."
      window: []
      currency: "USD"
      limit: {
        balance: [
          {
            layer: PENDING
            amount: "decimal('-Infinity')"
            normalBalanceType: CREDIT
          }
        ]
      }
      condition: "context.vars.entry.direction == CREDIT"
    }
  ) {
    velocityLimitId
  }

  blockCreditsControl: createVelocityControl(
    input: {
      velocityControlId: "9ae288eb-923f-4449-a18d-f315ed2d5523"
      name: "Block Credits"
      description: "Prevents the end user account from going up in balance."
      enforcement: {
        action: REJECT
      }
      velocityLimitIds: ["856502e0-3984-47c3-b15a-07a6f62c15c2"]
    }
  ) {
    velocityControlId
  }

  bert:createAccount(
    input: {
      accountId: "6c6affb0-5cf5-402b-8d84-01bfc1624a2c"
      name: "Bert - Checking"
      code: "BERT.CHECKING"
      description: "Bert's checking account"
      normalBalanceType: CREDIT
    }
  ) {
    accountId
    name
  }
  earni:createAccount(
    input: {
      accountId: "bf716346-9eee-4ec5-bbc3-64c47de7d929"
      name: "Earni - Checking"
      code: "EARNIE.CHECKING"
      description: "Earnie's checking account"
      normalBalanceType: CREDIT
      config: {
        enableConcurrentPosting: true
      }
    }
  ) {
    accountId
    name
  }

  bertAttach: attachVelocityControl(
    velocityControlId: "9ae288eb-923f-4449-a18d-f315ed2d5523"
    accountId: "6c6affb0-5cf5-402b-8d84-01bfc1624a2c"
    params: {}
  ) {
    velocityControlId
  }

}
