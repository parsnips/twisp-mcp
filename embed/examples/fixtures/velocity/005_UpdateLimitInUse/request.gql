mutation DeleteLimit {
  updateVelocityLimit(
    velocityLimitId: "370ac19b-a48c-4480-9b1f-18c39d214a0a"
    input:{
      limit:{
        balance:[
          {
            amount:"decimal('0.00')"
            normalBalanceType:"CREDIT"
            layer:"PENDING"
          }
        ]
      }
    }
  ) {
    velocityLimitId
  }
}
