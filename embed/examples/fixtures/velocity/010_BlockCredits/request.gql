mutation RejectCredit(
  $transactionId: UUID! = "uuid.New()" @cel
){
  postTransaction(
    input:{
      transactionId: $transactionId
      tranCode: "BOOK_TRANSFER"
      params:{
        journalId: "00000000-0000-0000-0000-000000000000"
        correlationId: "a2aa5351-9228-4d53-b500-3cef1f4a2cf4"
        crAccount: "6c6affb0-5cf5-402b-8d84-01bfc1624a2c"
        drAccount: "bf716346-9eee-4ec5-bbc3-64c47de7d929"
        amount: "100.00"
        currency: "USD"
        effective: "2020-01-01T01:00:00Z"
        metadata: {}
      }
    }
  ){
    transactionId
  }
}
