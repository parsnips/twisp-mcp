query Balances(
  $jobId: UUID! = "c33da1b4-68a5-4364-9581-425269e7c061"
  $pendingId: UUID! = "069f2222-5939-4e12-8c95-adebcbb21273"
  $acquireId: UUID! = "0afd5a29-f4d5-441c-8af8-7d291dd230d9"
  $platformId: UUID! = "a8555509-36ac-4c5c-a60c-acf993511544"
  $pbpFBOId: UUID! = "15468386-8244-42b8-98ff-7774f994726f"
  $client1Id: UUID! = "c2f4d626-19fd-4db8-82c9-062092f6d0ae"
  $generalId: UUID! = "5fb8d638-7ab6-4d8e-9d94-7ca9bd9efea2"
  $pbpId: UUID! = "332bef76-b1a0-430c-902b-abe2b5f39df0"
  $client1LiabId: UUID! = "66ad5b93-7676-45a9-8b1f-069a2b60268e"
  $parkersId: UUID! = "81472d9b-ff70-49ca-bd32-534a8fbc1b30"
) {
  job:balance(accountId: $jobId) {
    ...SettledBalance
  }
  pending: balance(accountId: $pendingId) {
    ...SettledBalance
  }
  acquire: balance(accountId: $acquireId) {
    ...SettledBalance
  }
  platform: balance(accountId: $platformId) {
    ...SettledBalance
  }
  pbpFBO: balance(accountId: $pbpFBOId) {
    ...SettledBalance
  }
  client1FBO: balance(accountId: $client1Id) {
    ...SettledBalance
  }
  general: balance(accountId: $generalId) {
    ...SettledBalance
  }
  pbp: balance(accountId: $pbpId) {
    ...SettledBalance
  }
  client1Liability: balance(accountId: $client1LiabId) {
    ...SettledBalance
  }  
  parkers: balance(accountId: $parkersId) {
    ...SettledBalance
  }
}

fragment SettledBalance on Balance {
  account {
    name
  }
  available(layer: SETTLED) {
    normalBalance {
      units
      currency
    }
  }
  settled {
    drBalance {
      units
      currency
    }
    crBalance {
      units
      currency
    }
  }
}

query Search {
  balances(
    index: {
      name: SEARCH
    }
    where: {
      search: {
        index: "search"
        query: {
          term:{
            location: "A1"
          }
        }
      }
    }
    first:1000
  ) {
    nodes {
      calculationId
    }
  }
}
