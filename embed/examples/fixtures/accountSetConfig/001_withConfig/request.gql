mutation CreateAccountSetMutation($j: JournalInput!, $a: AccountSetInput!, $b: AccountSetInput!, $c: AccountSetInput!) {
  j: createJournal(input: $j) {
    journalId
  }
  a: createAccountSet(input: $a) {
    accountSetId
    config {
      enableConcurrentPosting
    }
  }
  b: createAccountSet(input: $b) {
    accountSetId
    config {
      enableConcurrentPosting
    }
  }
  c: createAccountSet(input: $c) {
    accountSetId
    config {
      enableConcurrentPosting
    }
  }
}
