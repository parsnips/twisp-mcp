mutation CreateAccountSetMutation(
  $id_a: UUID!, $id_b: UUID!, $id_c: UUID!,
  $a: AccountSetUpdateInput!, $b: AccountSetUpdateInput!, $c: AccountSetUpdateInput!
) {
  a: updateAccountSet(id: $id_a, input: $a) {
    accountSetId
    config {
      enableConcurrentPosting
    }
  }
  b: updateAccountSet(id: $id_b, input: $b) {
    accountSetId
    config {
      enableConcurrentPosting
    }
  }
  c: updateAccountSet(id: $id_c, input: $c) {
    accountSetId
    config {
      enableConcurrentPosting
    }
  }
}
