query GetBalance {
  YYYY2022: balance(
    accountId: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5"
    journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
    effective: { period: "2022" }
  ) {
    available(layer: SETTLED) {
      drBalance {
        units
      }
      crBalance {
        units
      }
    }
  }
  YYYYMM: balance(
    accountId: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5"
    journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
    effective: { period: "2022-01" }
  ) {
    available(layer: SETTLED) {
      drBalance {
        units
      }
      crBalance {
        units
      }
    }
  }
  YYYYMMDD: balance(
    accountId: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5"
    journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
    effective: { period: "2022-01-01" }
  ) {
    available(layer: SETTLED) {
      drBalance {
        units
      }
      crBalance {
        units
      }
    }
  }
  YYYYMMDD2: balance(
    accountId: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5"
    journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
    calculationId: "d5266633-1723-47ca-b6c0-67d009fa2dbe"
    dimension: { year: "2022", month: "1", day: "15" }
  ) {
    available(layer: SETTLED) {
      drBalance {
        units
      }
      crBalance {
        units
      }
    }
  }
  JanBalances: balances(
    index: { name: CUSTOM }
    where: {
      custom: { index: "JanBalances" }
      accountId: { eq: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5" }
      journalId: { eq: "822cb59f-ce51-4837-8391-2af3b7a5fc51" }
      calculationId: { eq: "6c9fec2a-54f1-4a43-bbf8-4d9f31100c68" }
      dimension: { gte: { effectiveDate: "2022-01-01", payPeriod: "1" } }
    }
    first: 100
  ) {
    nodes {
      available(layer: SETTLED) {
        drBalance {
          units
        }
        crBalance {
          units
        }
      }
      dimensions
    }
  }
  JanOnlyByPayPeriod: balances(
    index: { name: CUSTOM }
    where: {
      custom: { index: "JanOnlyByPayPeriod", sort: [{ alias: "payPeriod", value: { eq: "2" } }] }
      accountId: { eq: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5" }
      journalId: { eq: "822cb59f-ce51-4837-8391-2af3b7a5fc51" }
    }
    first: 100
  ) {
    nodes {
      available(layer: SETTLED) {
        drBalance {
          units
        }
        crBalance {
          units
        }
      }
    }
  }
  JanOnly: balance(
    accountId: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5"
    journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
    calculationId: "6c9fec2a-54f1-4a43-bbf8-4d9f31100c68"
    dimension: { effectiveDate: "2022-01-15", payPeriod: "2" }
  ) {
    available(layer: SETTLED) {
      drBalance {
        units
      }
      crBalance {
        units
      }
    }
  }
  JanOnlyNoFeb: balance(
    accountId: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5"
    journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
    calculationId: "6c9fec2a-54f1-4a43-bbf8-4d9f31100c68"
    dimension: { effectiveDate: "2022-02-15", payPeriod: "4" }
  ) {
    available(layer: SETTLED) {
      drBalance {
        units
      }
      crBalance {
        units
      }
    }
  }
  YYYYMMDD3: balances(
    index: { name: CALCULATION }
    where: {
      accountId: { eq: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5" }
      journalId: { eq: "822cb59f-ce51-4837-8391-2af3b7a5fc51" }
      calculationId: { eq: "d5266633-1723-47ca-b6c0-67d009fa2dbe" }
      dimension: { eq: { year: "2022", month: "1", day: "15" } }
    }
    first: 1
  ) {
    nodes {
      available(layer: SETTLED) {
        drBalance {
          units
        }
        crBalance {
          units
        }
      }
    }
  }
  cumulative: balance(
    accountId: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5"
    journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
    effective: { cumulative: "2023-01-01" }
  ) {
    available(layer: SETTLED) {
      drBalance {
        units
      }
      crBalance {
        units
      }
    }
  }
  range: balance(
    accountId: "1fd1dd3e-33fe-4ef5-9d58-676ef8d306b5"
    journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
    effective: { range: { lte: "2022-02-20", gte: "2022" } }
  ) {
    entries(first: 100) {
      nodes {
        transaction {
          effective
        }
      }
    }
    available(layer: SETTLED) {
      drBalance {
        units
      }
      crBalance {
        units
      }
    }
  }
}
