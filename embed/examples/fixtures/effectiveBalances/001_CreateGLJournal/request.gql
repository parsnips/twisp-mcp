mutation CreateGeneralLedger {
  createJournal(input: {
    journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
    name: "General Ledger"
    description: "Primary journal for Zuzu."
    config: {
      enableEffectiveBalances: true
    }
  }) {
    journalId
    name
    description
    status
  }
}
