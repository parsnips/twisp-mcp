mutation CreateCustomerAccounts($ernieId: UUID!, $bertId: UUID!, $elmoId: UUID!) {
  ernie_checking: createAccount(
    input: {accountId: $ernieId, name: "Ernie Bishop - Checking", code: "ERNIE.CHECKING.accounts_test", description: "Ernie's checking account", normalBalanceType: CREDIT, metadata: {customIndex: {alpha: "yes"}}}
  ) {
    accountId
    name
    metadata
  }
  bert_checking: createAccount(
    input: {accountId: $bertId, name: "Bert - Checking", code: "BERT.CHECKING.accounts_test", description: "Bert's checking account", normalBalanceType: CREDIT, metadata: {customIndex: {alpha: "yes"}}}
  ) {
    accountId
    name
    metadata
  }
  elmo_checking: createAccount(
    input: {accountId: $elmoId, name: "Elmo - Checking", code: "ELMO.CHECKING.accounts_test", description: "Elmo's checking account", normalBalanceType: CREDIT, metadata: {customIndex: {alpha: "no"}}}
  ) {
    accountId
    name
    metadata
  }
  del1: deleteAccount(id: $ernieId) {
    status
  }
}
