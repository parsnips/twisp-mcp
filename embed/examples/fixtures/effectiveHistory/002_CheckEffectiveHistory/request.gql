query Balances {
  balance(
    accountId: "6c6affb0-5cf5-402b-8d84-01bfc1624a2c"
    effective: { cumulative: "2025-06-15" }
  ) {
    available(layer: SETTLED) {
      normalBalance {
        units
      }
    }
    entries(first: 26) {
      pageInfo {
        hasPreviousPage
        hasNextPage
      }
      nodes {
        transaction {
          effective
        }
      }
    }

    history(first: 13) {
      nodes {
        entry {
          transaction {
            effective
          }
        }
      }
      pageInfo {
        hasPreviousPage
        hasNextPage
      }
    }
  }
}
