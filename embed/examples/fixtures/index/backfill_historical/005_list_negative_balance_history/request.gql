query negativeBalances($acct0: String!) {
  balances(
    index: {
      name: CUSTOM
      sort:ASC
    }
    first: 10
    where: {
      custom: {
        index:"negative balance history"
        partition: [{alias:"accountId", value: {eq: $acct0}}]
        sort:[{alias: "normal balance", value: {lt: "0"}}]
      }
    }
  ) {
    nodes {
      settled {
        normalBalance {
          units
          currency
        }
      }
    }
  }
}
