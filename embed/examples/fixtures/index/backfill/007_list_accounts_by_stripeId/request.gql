query stripeAccounts {
  accounts(
    first:10
    index: {
      name:CUSTOM
      sort: ASC
    }
    where: {
      custom: {
        index: "Accounts.metadata.stripeId"
        sort: {
          alias:"stripeId"
          value: {
            gte: ""
          }
        }
      }
    }
  ) {
    nodes {
      metadata
    }
  }
}
