mutation CreateWorldPayIndex {
  index: schema {
    createIndex(
      input: {
        name: "Account.metadata.mids"
        on: Account
        unique: true
        partition: [{ alias: "mids", value: "document.metadata.mids", type: STRING }]
        sort: []
        constraints: { hasMids: "has(document.metadata.mids)" }
      }
    ) {
      partition {
        alias
        value
        type
      }
    }
  }
}
