query GetByMid($mid: String! = "worldpay:1") {
  accountSets(
    index: { name: CUSTOM }
    where: {
      custom: {
        index: "mids"
        partition: [{ alias: "mids", value: { eq: $mid } }]
        sort: [{ alias: "created", value: { gt: "2000-01-01T00:00:00.000Z" } }]
      }
    }
    first: 1000
  ) {
    nodes {
      accountSetId
    }
  }
}
