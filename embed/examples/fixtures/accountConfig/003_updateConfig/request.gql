mutation CreateAccountMutation(
  $id_a: UUID!, $id_b: UUID!, $id_c: UUID!,
  $a: AccountUpdateInput!, $b: AccountUpdateInput!, $c: AccountUpdateInput!
) {
  a: updateAccount(id: $id_a, input: $a) {
    accountId
    config {
      enableConcurrentPosting
    }
  }
  b: updateAccount(id: $id_b, input: $b) {
    accountId
    config {
      enableConcurrentPosting
    }
  }
  c: updateAccount(id: $id_c, input: $c) {
    accountId
    config {
      enableConcurrentPosting
    }
  }
}
