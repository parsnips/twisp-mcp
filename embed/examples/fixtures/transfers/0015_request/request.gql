mutation CreateAccount($accountId: UUID!, $accountSetIds: [UUID]!, $name: String!, $code: String!, $description: String!, $normalBalanceType: DebitOrCredit!, $config: AccountConfigInput!, $metadata: JSON) {
  createAccount(
    input: {accountId: $accountId, accountSetIds: $accountSetIds, name: $name, code: $code, description: $description, normalBalanceType: $normalBalanceType, config: $config, metadata: $metadata}
  ) {
    accountId
    name
    code
    description
    normalBalanceType
    metadata
  }
}
