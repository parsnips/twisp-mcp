mutation CreateBookTransferPendingTranCode(
  $tranCodeId: UUID! = "uuid.New()" @cel
) {
  createTranCode (
    input: {
      tranCodeId: $tranCodeId
      code: "BOOK_TRANSFER_PENDING"
      description: "Transfer of funds from one account to another at the same bank."
      params: [
        {
          name: "fromAccountId"
          type: UUID
          description: "Sender's account ID."
        }
        {
          name: "toAccountId"
          type: UUID
          description: "Receiver's account ID."
        }
        {
          name: "amount"
          type: DECIMAL
          description: "Amount with decimal, e.g. `1.23`."
        }
        {
          name: "effective"
          type: DATE
          description: "Effective date for transaction."
        }
        {
          name: "journalId"
          type: UUID
          description: "Journal"
        }
        {
          name: "correlationId"
          type: STRING
          description: "Correlation Id"
        }
        {
          name: "metadata"
          type: JSON
          description: "metadata"
          default: "{}"
        }
      ]
      transaction: {
        correlationId: "params.correlationId"
        effective: "params.effective"
        journalId: "params.journalId"
        metadata: "params.metadata"
      }
      entries: [
        {
          accountId: "uuid(params.fromAccountId)"
          units: "params.amount"
          currency: "'USD'"
          entryType: "'BOOK_TRANSFER_DR'"
          direction: "DEBIT"
          layer: "PENDING"
        }
        {
          accountId: "uuid(params.toAccountId)"
          units: "params.amount"
          currency: "'USD'"
          entryType: "'BOOK_TRANSFER_CR'"
          direction: "CREDIT"
          layer: "PENDING"
        }
      ]
    }
  ) {
    code
  }
}
