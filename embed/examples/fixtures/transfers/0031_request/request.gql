mutation SettleTransferTransaction($executionId: UUID!, $tranCode: String!, $workflowId: UUID!) {
  settle: workflow {
    execute(
      input: {task: "SETTLE", workflowId: $workflowId, executionId: $executionId, params: {tranCode: $tranCode}}
    ) {
      output {
        state
      }
    }
  }
}
