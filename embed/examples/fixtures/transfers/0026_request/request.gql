mutation CreateTransferPendingTransaction($amount: Decimal!, $currency: String!, $effective: Date!, $executionId: UUID!, $fromAccountId: UUID!, $journalId: UUID!, $metadata: JSON, $toAccountId: UUID!, $tranCode: String!, $workflowId: UUID!) {
  pending: workflow {
    execute(
      input: {task: "PENDING", workflowId: $workflowId, executionId: $executionId, params: {amount: $amount, currency: $currency, effective: $effective, fromAccountId: $fromAccountId, journalId: $journalId, metadata: $metadata, toAccountId: $toAccountId, tranCode: $tranCode}}
    ) {
      output {
        state
      }
    }
  }
}
