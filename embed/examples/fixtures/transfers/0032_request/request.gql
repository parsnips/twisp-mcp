query GetAccountBalance($accountId: UUID!, $journalId: UUID!) {
  account(id: $accountId) {
    balance(currency: "USD", journalId: $journalId, type: PREPARED) {
      version
      encumbrance {
        normalBalance {
          units
        }
      }
      pending {
        normalBalance {
          units
        }
      }
      settled {
        normalBalance {
          units
        }
      }
    }
  }
}
