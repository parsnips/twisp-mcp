mutation CreateTransferSettledTranCode(
  $tranCodeId: UUID! = "254f0162-9eb6-4b7f-b88f-3e5dfd81012c"
) {
  createTranCode(
    input: {
      tranCodeId: $tranCodeId
      code: "TRANSFER_SETTLED"
      description: "Settle a pending ACH credit into a customer account."
      params: [
        {
          name: "fromAccountId"
          type: UUID
          description: "Sender's account ID."
        }
        {
          name: "toAccountId"
          type: UUID
          description: "Receiver's account ID."
        }
        {
          name: "amount"
          type: DECIMAL
          description: "Amount with decimal, e.g. `1.23`."
        }
        {
          name: "effective"
          type: DATE
          description: "Effective date for transaction."
        }
        {
          name: "journalId"
          type: UUID
          description: "Journal"
        }
        {
          name: "correlationId"
          type: STRING
          description: "Correlation Id"
        }
        {
          name: "metadata"
          type: JSON
          description: "metadata"
          default: "{}"
        }
      ]
      transaction: {
        correlationId: "params.correlationId"
        effective: "params.effective"
        journalId: "params.journalId"
        metadata: "params.metadata"
      }
      entries: [
        {
          accountId: "uuid(params.fromAccountId)"
          units: "params.amount"
          currency: "'USD'"
          entryType: "'TRANSFER_DR'"
          direction: "DEBIT"
          layer: "SETTLED"
        }
        {
          accountId: "uuid(params.toAccountId)"
          units: "params.amount"
          currency: "'USD'"
          entryType: "'TRANSFER_CR'"
          direction: "CREDIT"
          layer: "SETTLED"
        }
      ]
    }
  ) {
    code
  }
}
