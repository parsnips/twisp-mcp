mutation Eval(
  $tsInjected: Timestamp! = "timestamp(string(this.dateInjected)+'T00:00:00Z')" @cel
  $dateInjected: Date! = "date('2020-01-01')" @cel
) {
  evaluate(
    expressions:{
      ts: "timestamp('2020-01-01T01:00:00.000Z')"
      tsInjected: "document.tsInjected"
      date: "date('2020-01-01')"
      dateInjected: "document.dateInjected"
    }
    document:{
      tsInjected: $tsInjected
      dateInjected: $dateInjected
    }
  )
}
