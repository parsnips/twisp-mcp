mutation createTranCodeIndex {
  schema {
    createIndex(
      input: {name: "tier", on: TranCode, unique: false, partition: [{alias: "tier", value: "string(document.metadata.tier)"}], sort: [], constraints: {a: "1 + 1 == 2"}}
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
    }
  }
}
