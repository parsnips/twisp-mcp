mutation UpsertAccountSetMember {
  # First create a journal to use for account set
  journal: createJournal(
    input: {
      journalId: "3e7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      name: "Test Membership Journal"
      description: "Journal for testing account set membership"
    }
  ) {
    journalId
  }

  # Create an account set with the journal
  accountSet: createAccountSet(
    input: {
      accountSetId: "3f7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      journalId: "3e7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      name: "TestMembershipSet"
      description: "Testing account set membership upsert"
      normalBalanceType: CREDIT
    }
  ) {
    accountSetId
  }

  childSet: createAccountSet(
    input: {
      accountSetId: "fb9f7d7a-1187-11f0-a785-069b540ea27b"
      journalId: "3e7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      name: "TestMembershipSetChild"
      description: "Testing account set membership upsert"
      normalBalanceType: CREDIT
    }
  ) {
    accountSetId
  }

  # Create an account to add as a member
  account: createAccount(
    input: {
      accountId: "4f7b55f0-7c47-41c7-8fc0-b9de3a24a379"
      name: "TestMemberAccount"
      code: "TEST_MEMBER"
    }
  ) {
    accountId
  }

  # First add to account set - should succeed
  a: addToAccountSet(
    id: "3f7b55f0-7c47-41c7-8fc0-b9de3a24a379"
    member: { memberId: "fb9f7d7a-1187-11f0-a785-069b540ea27b", memberType: ACCOUNT_SET }
  ) {
    accountSetId
    members(first: 1) {
      nodes {
        ... on AccountSet {
          accountSetId
        }
      }
    }
  }

  # Second add to account set (duplicate) - should also succeed due to upsert
  b: addToAccountSet(
    id: "3f7b55f0-7c47-41c7-8fc0-b9de3a24a379"
    member: { memberId: "fb9f7d7a-1187-11f0-a785-069b540ea27b", memberType: ACCOUNT_SET }
  ) {
    accountSetId
    members(first: 1) {
      nodes {
        ... on AccountSet {
          accountSetId
        }
      }
    }
  }

  # Add an account to the upserted set.
  c: addToAccountSet(
    id: "fb9f7d7a-1187-11f0-a785-069b540ea27b"
    member: { memberId: "4f7b55f0-7c47-41c7-8fc0-b9de3a24a379", memberType: ACCOUNT }
  ) {
    accountSetId
    members(first: 1) {
      nodes {
        ... on Account {
          accountId
        }
      }
    }
  }

  # Third add to account set (duplicate) - Should succeed because already attached.
  d: addToAccountSet(
    id: "3f7b55f0-7c47-41c7-8fc0-b9de3a24a379"
    member: { memberId: "fb9f7d7a-1187-11f0-a785-069b540ea27b", memberType: ACCOUNT_SET }
  ) {
    accountSetId
    members(first: 1) {
      nodes {
        ... on AccountSet {
          accountSetId
        }
      }
    }
  }
}
