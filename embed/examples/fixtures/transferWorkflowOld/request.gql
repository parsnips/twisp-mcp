mutation CreateAccounts {
  a: createAccount(
    input:{
      accountId: "3be5bca0-8297-4289-818b-a921bcdbf72d"
      code: "3be5bca0-8297-4289-818b-a921bcdbf72d"
      name: "a"
    }
  ) {
    accountId
  }
  b: createAccount(
    input:{
      accountId: "eba175af-f98a-46b7-ba9d-45f99d505445"
      code: "eba175af-f98a-46b7-ba9d-45f99d505445"
      name: "b"
    }
  ) {
    accountId
  }
  j: createJournal(
    input:{
      journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
      name: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
      code: "GL"
    }
  )  {
    journalId
  }
    pending:createTranCode(
    input: {
      tranCodeId: "82eaf23c-bcbc-4f48-bee4-9720a81cb3de"
      code: "SAMPLE_TRANSFER_PENDING"
      description: "Book transfer between two internal accounts."
      metadata: { category: "Internal" }
      params: [
        { name: "crAccount", type: UUID, description: "Account to credit." }
        { name: "drAccount", type: UUID, description: "Account to debit." }
        { name: "amount", type: DECIMAL, description: "Amount with decimal, e.g. `1.23`." }
        { name: "currency", type: STRING, description: "Currency used for transaction." }
        { name: "effective", type: DATE, description: "Effective date for transaction." }
        { name: "journalId", type: UUID, description: "Journal" }
        { name: "correlationId", type: STRING, description: "Correlation Id" }
        { name: "metadata", type: JSON, description: "Metadata", default: "{}" }
      ]
      transaction: {
        journalId: "params.journalId"
        effective: "params.effective"
        description: "'Book transfer for $' + string(params.amount)"
        correlationId: "params.correlationId"
        metadata: "params.metadata"
      }
      entries: [
        {
          accountId: "params.drAccount"
          units: "params.amount"
          currency: "params.currency"
          entryType: "'BOOK_TRANSFER_DR'"
          direction: "DEBIT"
          layer: "PENDING"
        }
        {
          accountId: "params.crAccount"
          units: "params.amount"
          currency: "params.currency"
          entryType: "'BOOK_TRANSFER_CR'"
          direction: "CREDIT"
          layer: "PENDING"
        }
      ]
    }
  ) {
    tranCodeId
  }
  settled:createTranCode(
    input: {
      tranCodeId: "b8632f0f-2040-4845-81e8-3db542644705"
      code: "SAMPLE_TRANSFER_SETTLED"
      description: "Book transfer between two internal accounts."
      metadata: { category: "Internal" }
      params: [
        { name: "crAccount", type: UUID, description: "Account to credit." }
        { name: "drAccount", type: UUID, description: "Account to debit." }
        { name: "amount", type: DECIMAL, description: "Amount with decimal, e.g. `1.23`." }
        { name: "currency", type: STRING, description: "Currency used for transaction." }
        { name: "effective", type: DATE, description: "Effective date for transaction." }
        { name: "journalId", type: UUID, description: "Journal" }
        { name: "correlationId", type: STRING, description: "Correlation Id" }
        { name: "metadata", type: JSON, description: "Metadata", default: "{}" }
      ]
      transaction: {
        journalId: "params.journalId"
        effective: "params.effective"
        description: "'Book transfer for $' + string(params.amount)"
        correlationId: "params.correlationId"
        metadata: "params.metadata"
      }
      entries: [
        {
          accountId: "params.drAccount"
          units: "params.amount"
          currency: "params.currency"
          entryType: "'BOOK_TRANSFER_DR'"
          direction: "DEBIT"
          layer: "SETTLED"
        }
        {
          accountId: "params.crAccount"
          units: "params.amount"
          currency: "params.currency"
          entryType: "'BOOK_TRANSFER_CR'"
          direction: "CREDIT"
          layer: "SETTLED"
        }
      ]
    }
  ) {
    tranCodeId
  }
}
