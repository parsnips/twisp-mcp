query WorkflowHistory {
  workflow {
    execution(executionId:"5368ff5e-48b5-4c69-a6c3-d4efcf3804ef") {
      task
      params
      context
      history(first: 1000) {
        nodes {
          task
          params
          context
          created
          modified
        }
      }
    }
  }
}
