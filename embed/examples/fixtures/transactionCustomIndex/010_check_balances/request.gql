query CheckAccountBalances($ernieId: UUID!, $bertId: UUID!, $journalId: UUID!) {
  ernie: account(id: $ernieId) {
    name
    balance(journalId: $journalId, currency: "USD") {
      settled {
        normalBalance {
          units
        }
      }
    }
  }
  bert: account(id: $bertId) {
    name
    balance(journalId: $journalId) {
      settled {
        normalBalance {
          units
        }
      }
    }
  }
}
