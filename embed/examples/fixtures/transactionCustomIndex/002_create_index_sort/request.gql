mutation createTransactionIndex {
  schema {
    createIndex(
      input: {name: "effective", on: Transaction, unique: false, partition: [], sort: [{alias: "effective", value: "date(document.effective)", sort: ASC}], constraints: {a: "1 + 1 == 2"}}
    ) {
      name
      range {
        alias
        value
        sort
      }
      partition {
        alias
        value
      }
      on
      constraints
      unique
    }
  }
}
