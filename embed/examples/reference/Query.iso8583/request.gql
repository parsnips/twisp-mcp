# Setup for ISO8583 query tests: Create a journal, settlement account, and two ISO8583 configs
mutation SetupForQueries($i2c: JSON) {
  # Create a journal for ISO8583 transactions
  createJournal(
    input: {
      journalId: "8b65c8dc-0515-11f0-a441-069b540ea27c"
      name: "ISO8583 Test Journal"
      description: "Journal for ISO8583 test transactions"
    }
  ) {
    journalId
  }

  # Create a settlement account
  createAccount(
    input: {
      accountId: "779886bc-0515-11f0-aa78-069b540ea27c"
      name: "ISO8583 Settlement Account"
      code: "ISO8583"
      normalBalanceType: CREDIT
    }
  ) {
    accountId
  }

  # Create the first ISO8583 config
  config1: iso8583 {
    createConfig(
      input: {
        configId: "670504f6-0515-11f0-a441-069b540ea27c"
        journalId: "8b65c8dc-0515-11f0-a441-069b540ea27c"
        settlementAccountId: "779886bc-0515-11f0-aa78-069b540ea27c"
        timeZone: "America/Chicago"
        description: "ISO8583 Test Config 1"
        processor: I2C
      }
    ) {
      configId
    }
  }

  # Create the second ISO8583 config
  config2: iso8583 {
    createConfig(
      input: {
        configId: "7e0d3fa2-0515-11f0-a6b2-069b540ea27c"
        journalId: "8b65c8dc-0515-11f0-a441-069b540ea27c"
        settlementAccountId: "779886bc-0515-11f0-aa78-069b540ea27c"
        timeZone: "America/New_York"
        description: "ISO8583 Test Config 2"
        processor: I2C
        processorSpec: $i2c
      }
    ) {
      configId
    }
  }
}
