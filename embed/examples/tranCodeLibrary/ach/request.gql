mutation ACH_Setup {
  achSettlementAcct: createAccount(
    input: {
      accountId: "38897a35-0de5-4055-9a87-dc5256fc96b7"
      name: "ACH Settlement"
      code: "ACH_SETTLE"
      description: "ACH Settlement account"
      status: ACTIVE
      normalBalanceType: DEBIT
    }
  ) {
    accountId
  }

  exampleUserAcct: createAccount(
    input: {
      accountId: "fcb5a92f-cafb-4076-93dd-5df6d759a482"
      name: "Example Acct"
      code: "USER_ACCT"
      description: "Example User Acct"
      status: ACTIVE
      normalBalanceType: DEBIT
    }
  ) {
    accountId
  }
}