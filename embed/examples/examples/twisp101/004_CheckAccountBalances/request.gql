query CheckAccountBalances(
  $ernieId: UUID!
  $bertId: UUID!
  $assetsId: UUID!
  $journalId: UUID!
) {
  ernie: account(id: $ernieId) {
    name
    balance(journalId: $journalId) {
      settled {
        normalBalance {
          units
        }
      }
    }
  }

  bert: account(id: $bertId) {
    name
    balance(journalId: $journalId) {
      settled {
        normalBalance {
          units
        }
      }
    }
  }

  assets: account(id: $assetsId) {
    name
    balance(journalId: $journalId) {
      settled {
        normalBalance {
          units
        }
      }
    }
  }
}
