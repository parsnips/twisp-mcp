mutation BasicTranCodeSetup {
  createJournal(
    input: {
      journalId: "822cb59f-ce51-4837-8391-2af3b7a5fc51"
      name: "GL"
      description: "General Ledger"
    }
  ) {
    journalId
  }

  settlementAcct: createAccount(
    input: {
      accountId: "8cd11607-1104-4270-9482-ae4b8053fd5a"
      name: "ACH Settlement"
      code: "ACH_SETTLE"
      description: "ACH Settlement account"
      status: ACTIVE
      normalBalanceType: DEBIT
    }
  ) {
    accountId
  }

  customerAcct: createAccount(
    input: {
      accountId: "63e766a5-4a04-4aee-a4d6-aa49350f13c6"
      name: "Customer A"
      code: "CUST_A"
      description: "Customer A's account"
      status: ACTIVE
      normalBalanceType: CREDIT
    }
  ) {
    accountId
  }
}