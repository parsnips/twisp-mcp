mutation UpdateClient {
  auth {
    updateClient(principal:"arn:aws:iam::048962233173:user/github.action", input:{
      policies: [
        {
          effect: ALLOW,
          actions: [
            SELECT,
            INSERT,
            UPDATE,
          ],
          resources: [
            "financial.*"
          ],
          assertions: {
            isFalse: "true"
          }
        }
      ]
    }) {
      principal
      policies{
        assertions
        actions
      }
    }
  }   	
}
