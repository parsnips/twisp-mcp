mutation CreateClient {
  auth {
   	createClient(
    input: {
      principal: "arn:aws:iam::048962233173:user/github.action",
      name: "Github",
      policies: [
        {
          effect: ALLOW,
          actions: [
            SELECT,
            INSERT,
            UPDATE,
            DELETE
          ],
          resources: [
            "financial.*"
          ],
          assertions: {
            isTrue: "true"
          }
        }
      ]
    }
    ) {
      principal
    }
  }
}
